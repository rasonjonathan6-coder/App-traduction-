name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create placeholder APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          echo "This is a placeholder APK for testing purposes" > app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
